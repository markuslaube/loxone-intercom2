version: "3.8"

services:
  loxone-directbridge:
    image: loxone-intercom-directbridge:latest
    environment:
      # === Required ===
      - LOXONE_INTERCOM_IP=192.168.1.190

      # === Optional (defaults shown) ===
      # - LOXONE_TURN_SERVER=stun.loxonecloud.com:3478
      # - LOXONE_STUN_SERVER=stun.l.google.com:19302
      # - LOXONE_RTSP_HOST=loxone-directbridge
      # - LOXONE_RTSP_PORT=8554
      # - LOXONE_STREAM_NAME=loxone_intercom
      # - GO2RTC_API_URL=http://go2rtc:1984
      # - LOXONE_GO2RTC_RECONCILE_SECONDS=20
      # - LOXONE_LOG_LEVEL=INFO
    networks:
      - default

networks:
  default:
    # Put this container in the same network as your go2rtc instance.
    # For Home Assistant / Frigate setups, this is often the addon network:
    # default:
    #   external: true
    #   name: homeassistant-addons_default
